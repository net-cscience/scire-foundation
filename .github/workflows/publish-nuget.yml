name: Publish NuGet Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show repository structure
        run: find . -maxdepth 4 -type f | sort

      - name: Restore
        run: >
          dotnet restore
          tests/SCIRE.Foundation.Abstractions.Tests/SCIRE.Foundation.Abstractions.Tests.csproj

      - name: Test
        run: >
          dotnet test
          tests/SCIRE.Foundation.Abstractions.Tests/SCIRE.Foundation.Abstractions.Tests.csproj
          --configuration Release
          --no-restore

      - name: Pack
        run: >
          dotnet pack
          src/SCIRE.Foundation.Abstractions/SCIRE.Foundation.Abstractions.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:ContinuousIntegrationBuild=true

      - name: Configure GitHub Packages
        run: >
          dotnet nuget add source
          --username "${{ github.repository_owner }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish package
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source github
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate