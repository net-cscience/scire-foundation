name: Publish NuGet Package Alpha Channel

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  PACKAGE_VERSION: 0.1.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Show package version
        run: echo "Publishing version $PACKAGE_VERSION"

      - name: Restore
        run: dotnet restore SCIRE.Foundation.slnx

      - name: Test
        run: >
          dotnet test
          SCIRE.Foundation.slnx
          --configuration Release
          --no-restore

      - name: Pack Abstractions
        run: >
          dotnet pack
          src/SCIRE.Foundation.Abstractions/SCIRE.Foundation.Abstractions.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:ContinuousIntegrationBuild=true
          -p:PackageVersion=$PACKAGE_VERSION

      - name: Pack Runtime
        run: >
          dotnet pack
          src/SCIRE.Foundation.Runtime/SCIRE.Foundation.Runtime.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:ContinuousIntegrationBuild=true
          -p:PackageVersion=$PACKAGE_VERSION

      - name: Configure GitHub Packages
        run: >
          dotnet nuget add source
          --username "${{ github.repository_owner }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish packages
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source github
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate